
services:
  - type: web
    name: alkitabi-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false

      - key: FACEBOOK_VERIFY_TOKEN
        sync: false

      - key: FACEBOOK_API_VERSION
        value: v23.0
