services:
  - type: web
    name: bible-baptist-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: VERIFY_TOKEN
        value: baptist2026
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ALLOW_GROQ
        value: "0"
      - key: GROQ_KEY
        sync: false
      - key: PAGE_ACCESS_TOKEN
        sync: false
